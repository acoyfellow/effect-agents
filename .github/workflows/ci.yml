name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight CI run if a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: typecheck + offline smoke (no creds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Smoke (offline, all five examples)
        run: bun run smoke

  probe-local:
    name: probe against a real LLM (optional)
    runs-on: ubuntu-latest
    needs: smoke
    # Only runs when an OPENROUTER_API_KEY secret is configured on the repo.
    # Forks won't have it and will skip cleanly.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Probe local (real LLM)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY secret not set; skipping live probe."
            exit 0
          fi
          bun run probe:local
