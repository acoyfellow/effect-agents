<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- top hairline label -->
  <line x1="80" y1="100" x2="1120" y2="100" stroke="#27272a" stroke-width="1"/>
  <text x="80" y="80" font-family="'Google Sans Code', ui-monospace, Menlo, monospace" font-weight="500" font-size="20" fill="#52525b" letter-spacing="3">AN EXPERIMENT  ·  MAY 2026</text>

  <!-- huge headline -->
  <text x="80" y="280" font-family="'Google Sans Code', ui-monospace, Menlo, monospace" font-weight="700" font-size="120" fill="#f4f4f5" letter-spacing="-5">effect-agents</text>

  <!-- human tagline -->
  <text x="80" y="340" font-family="'Google Sans Flex', ui-sans-serif, system-ui, sans-serif" font-weight="500" font-size="30" fill="#a1a1aa">Five small AI agents, each in one file,</text>
  <text x="80" y="382" font-family="'Google Sans Flex', ui-sans-serif, system-ui, sans-serif" font-weight="500" font-size="30" fill="#a1a1aa">built with Effect v4.</text>

  <!-- middle hairline -->
  <line x1="80" y1="450" x2="1120" y2="450" stroke="#27272a" stroke-width="1"/>

  <!-- the five (column 1) -->
  <g font-family="'Google Sans Code', ui-monospace, Menlo, monospace" font-size="20" fill="#d4d4d8">
    <text x="80" y="500"><tspan fill="#52525b">01 </tspan>parallel-research</text>
    <text x="80" y="535"><tspan fill="#52525b">02 </tspan>streaming-tools</text>
    <text x="80" y="570"><tspan fill="#52525b">03 </tspan>approval-gated</text>
  </g>

  <!-- the five (column 2) -->
  <g font-family="'Google Sans Code', ui-monospace, Menlo, monospace" font-size="20" fill="#d4d4d8">
    <text x="620" y="500"><tspan fill="#52525b">04 </tspan>typed-errors</text>
    <text x="620" y="535"><tspan fill="#52525b">05 </tspan>mcp-from-toolkit</text>
  </g>

  <!-- footer hairline -->
  <line x1="80" y1="600" x2="1120" y2="600" stroke="#27272a" stroke-width="1"/>
  <text x="80" y="615" font-family="'Google Sans Code', ui-monospace, Menlo, monospace" font-size="14" fill="#52525b" letter-spacing="2">EFFECT-AGENTS.COEY.DEV</text>
  <text x="1120" y="615" font-family="'Google Sans Code', ui-monospace, Menlo, monospace" font-size="14" fill="#52525b" text-anchor="end" letter-spacing="2">GITHUB.COM/ACOYFELLOW</text>
</svg>
